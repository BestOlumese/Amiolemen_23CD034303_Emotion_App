<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 Emotion Detection AI</h1>
            <p>Upload an image or use live camera to detect emotions</p>
        </header>

        <div class="main-content">
            <div class="upload-section">
                <h2>Upload Image</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="name">Your Name (optional):</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name">
                    </div>
                    
                    <div class="form-group">
                        <label for="image">Select Image:</label>
                        <input type="file" id="image" name="image" accept="image/*" required>
                    </div>
                    
                    <button type="submit" class="btn-primary">Detect Emotion</button>
                </form>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h2>Detection Result</h2>
                <div class="result-card">
                    <img id="resultImage" src="" alt="Result">
                    <div class="result-info">
                        <h3 id="emotionText"></h3>
                        <p id="confidenceText"></p>
                    </div>
                </div>
            </div>

            <div class="live-section">
                <h2>Live Detection</h2>
                <p>Use your webcam for real-time emotion detection</p>
                <a href="/live_feed" class="btn-secondary">Start Live Detection</a>
            </div>

            <div class="history-section">
                <h2>Detection History</h2>
                <p>View previous emotion detection results</p>
                <a href="/history" class="btn-tertiary">View History</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
